<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>employee</title>
</head>
<body>
<script src="app.js"></script>
<h1>Employee Dashboard</h1>

<button onclick="clockIn()">Clock In</button>
<button onclick="clockOut()">Clock Out</button>
<button onclick="loadMyLogs()">My Activity</button>

<div id="content"></div>

<script>
    let user = JSON.parse(localStorage.getItem("user"));

function clockIn() {
    fetch(`http://localhost:8080/v1/employee/${user.employeeId}/clock-in?username=${user.username}`, {
        method: "POST"
    }).then(() => alert("Clocked in"));
}

function clockOut() {
    fetch(`http://localhost:8080/v1/employee/${user.employeeId}/clock-out?username=${user.username}`, {
        method: "PUT"
    }).then(() => alert("Clocked out"));
}
</script>

</body>
</html>
